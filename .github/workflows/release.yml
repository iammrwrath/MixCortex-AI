name: Build & Release MixCortex AI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Build & Publish MixCortex AI Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
        run: npx electron-builder --win nsis portable --publish always

      - name: Undraft GitHub Release & Populate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            echo "Publishing release notes from RELEASE_NOTES.md..."
            gh release edit ${{ github.ref_name }} --draft=false --notes-file RELEASE_NOTES.md || true
          else
            echo "Generating release notes via GitHub API..."
            NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name=${{ github.ref_name }} --jq .body || true)
            if [ -n "$NOTES" ]; then
              gh release edit ${{ github.ref_name }} --draft=false --notes "$NOTES" || true
            else
              gh release edit ${{ github.ref_name }} --draft=false || true
            fi
          fi
