<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bannerBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#140f28" />
      <stop offset="60%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>

    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f5d0fe" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="bannerBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background Card -->
  <rect width="1200" height="400" rx="28" fill="url(#bannerBg)" stroke="#1e2433" stroke-width="2" />
  <rect x="0" y="396" width="1200" height="4" fill="url(#bannerBorderGrad)" />

  <!-- Background Decorative Camelot Wheel Grid -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1.5">
    <circle cx="1000" cy="200" r="280" fill="none" stroke-dasharray="8 8" />
    <circle cx="1000" cy="200" r="220" fill="none" />
    <circle cx="1000" cy="200" r="160" fill="none" stroke-dasharray="12 12" />
    <circle cx="1000" cy="200" r="100" fill="none" />
  </g>

  <!-- Left Icon Lockup (x=160, y=200) -->
  <g transform="translate(100, 100)">
    <rect width="200" height="200" rx="48" fill="#0b0e17" stroke="#2a3048" stroke-width="2" />
    <circle cx="100" cy="100" r="84" fill="none" stroke="url(#bannerBorderGrad)" stroke-width="4" filter="url(#bannerGlow)" />

    <!-- Left Brain Hemisphere -->
    <path d="M 96 52 C 82 52, 62 60, 58 74 C 52 80, 48 92, 54 104 C 48 114, 52 130, 62 136 C 68 148, 84 156, 96 156 Z"
          fill="none" stroke="#c084fc" stroke-width="4.5" />
    <circle cx="68" cy="76" r="3" fill="#e879f9" />
    <circle cx="62" cy="100" r="3" fill="#22d3ee" />
    <circle cx="72" cy="130" r="3" fill="#e879f9" />

    <!-- Right Vinyl Audio Arcs -->
    <path d="M 104 52 C 118 52, 138 60, 142 74 C 148 80, 152 92, 146 104 C 152 114, 148 130, 138 136 C 132 148, 116 156, 104 156 Z"
          fill="none" stroke="#22d3ee" stroke-width="4.5" />
    <line x1="104" y1="72" x2="130" y2="72" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="104" y1="88" x2="140" y2="88" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" />
    <line x1="104" y1="104" x2="144" y2="104" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" />
    <line x1="104" y1="120" x2="138" y2="120" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" />
    <line x1="104" y1="136" x2="126" y2="136" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />

    <!-- Center Spindle -->
    <circle cx="100" cy="100" r="10" fill="#07090e" stroke="#c084fc" stroke-width="3.5" />
    <circle cx="100" cy="100" r="4" fill="#22d3ee" />
  </g>

  <!-- Typography & Features Right Side -->
  <g transform="translate(360, 115)">
    <!-- Main Title -->
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="url(#neonTitle)">
      MIXCORTEX AI
    </text>

    <!-- Subtitle -->
    <text x="4" y="105" font-family="ui-monospace, monospace" font-weight="700" font-size="18" letter-spacing="6" fill="#a855f7">
      STANDALONE NEURAL DJ CO-PILOT
    </text>

    <!-- Tagline Description -->
    <text x="4" y="145" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="17" fill="#94a3b8">
      Real-Time Harmonic Track Ideas • Sub-Millisecond Camelot Wheel Engine • 120 FPS
    </text>

    <!-- Compatibility Badges -->
    <g transform="translate(4, 180)">
      <!-- CloudMix Pro -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
        <text x="65" y="21" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#a5b4fc" text-anchor="middle">
          ⚡ CloudMix Pro
        </text>
      </g>

      <!-- Algoriddim djay Pro -->
      <g transform="translate(142, 0)">
        <rect width="130" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="65" y="21" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#7dd3fc" text-anchor="middle">
          🎧 djay Pro
        </text>
      </g>

      <!-- Serato DJ -->
      <g transform="translate(284, 0)">
        <rect width="115" height="32" rx="8" fill="#18181b" stroke="#71717a" stroke-width="1" />
        <text x="57" y="21" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#e4e4e7" text-anchor="middle">
          🎛️ Serato DJ
        </text>
      </g>

      <!-- Rekordbox -->
      <g transform="translate(411, 0)">
        <rect width="125" height="32" rx="8" fill="#1c1917" stroke="#fbbf24" stroke-width="1" />
        <text x="62" y="21" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#fde68a" text-anchor="middle">
          💿 Rekordbox
        </text>
      </g>

      <!-- Traktor / VirtualDJ -->
      <g transform="translate(548, 0)">
        <rect width="155" height="32" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1" />
        <text x="77" y="21" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#86efac" text-anchor="middle">
          🔊 Traktor &amp; VDJ
        </text>
      </g>
    </g>
  </g>
</svg>
