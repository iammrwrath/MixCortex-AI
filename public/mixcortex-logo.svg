<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f3e8ff" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Mark (Centered at x=60, y=60) -->
  <g transform="translate(10, 10)">
    <!-- Rounded Container -->
    <rect width="100" height="100" rx="24" fill="#0c0e17" stroke="#232738" stroke-width="1.5" />
    <circle cx="50" cy="50" r="42" fill="none" stroke="#334155" stroke-dasharray="3 3" opacity="0.6" />
    <circle cx="50" cy="50" r="38" fill="none" stroke="url(#badgeGrad)" stroke-width="2" filter="url(#logoGlow)" />

    <!-- Left Brain Hemisphere -->
    <path d="M 48 26 C 41 26, 31 30, 29 37 C 26 40, 24 46, 27 52 C 24 57, 26 65, 31 68 C 34 74, 42 78, 48 78 Z"
          fill="none" stroke="#c084fc" stroke-width="2.5" />
    <circle cx="34" cy="38" r="1.5" fill="#e879f9" />
    <circle cx="31" cy="50" r="1.5" fill="#22d3ee" />
    <circle cx="36" cy="65" r="1.5" fill="#e879f9" />

    <!-- Right Vinyl Audio Arcs -->
    <path d="M 52 26 C 59 26, 69 30, 71 37 C 74 40, 76 46, 73 52 C 76 57, 74 65, 69 68 C 66 74, 58 78, 52 78 Z"
          fill="none" stroke="#22d3ee" stroke-width="2.5" />
    <line x1="52" y1="36" x2="65" y2="36" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="52" y1="44" x2="70" y2="44" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" />
    <line x1="52" y1="52" x2="72" y2="52" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" />
    <line x1="52" y1="60" x2="69" y2="60" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" />
    <line x1="52" y1="68" x2="63" y2="68" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />

    <!-- Center Spindle -->
    <circle cx="50" cy="50" r="5" fill="#0b0e14" stroke="#a855f7" stroke-width="2" />
    <circle cx="50" cy="50" r="2" fill="#22d3ee" />
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(130, 20)">
    <!-- Primary Brand Title -->
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="2.5" fill="url(#logoTextGrad)">
      MIXCORTEX
    </text>

    <!-- AI Pill Badge -->
    <g transform="translate(230, 18)">
      <rect width="44" height="26" rx="6" fill="url(#badgeGrad)" filter="url(#logoGlow)" />
      <text x="22" y="18" font-family="ui-monospace, monospace" font-weight="900" font-size="14" fill="#000000" text-anchor="middle" letter-spacing="1">
        AI
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="2" y="72" font-family="ui-monospace, monospace" font-weight="700" font-size="11.5" letter-spacing="4" fill="#94a3b8">
      NEURAL DJ CO-PILOT
    </text>

    <!-- Accent Dot Line -->
    <line x1="2" y1="84" x2="272" y2="84" stroke="#1e2433" stroke-width="1.5" />
    <circle cx="2" cy="84" r="2" fill="#a855f7" />
    <circle cx="272" cy="84" r="2" fill="#06b6d4" />
  </g>
</svg>
